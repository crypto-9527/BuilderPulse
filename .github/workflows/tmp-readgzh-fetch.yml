name: Temporary ReadGZH Fetch

on:
  push:
    paths:
      - '.github/workflows/tmp-readgzh-fetch.yml'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch WeChat article through ReadGZH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp
          SLUG='5VDN-T9K8Wr-DaQ15-I6CA'
          SOURCE='https://mp.weixin.qq.com/s/5VDN-T9K8Wr-DaQ15-I6CA'
          CACHED="https://api.readgzh.site/rd?s=${SLUG}&format=text"
          FRESH="https://api.readgzh.site/rd?format=text&url=$(python3 -c 'import urllib.parse; print(urllib.parse.quote("https://mp.weixin.qq.com/s/5VDN-T9K8Wr-DaQ15-I6CA", safe=""))')"

          status=$(curl -L --retry 3 --retry-delay 3 --connect-timeout 20 --max-time 120 \
            -sS -w '%{http_code}' -o tmp/article.md "$CACHED" || true)

          if [[ "$status" != "200" ]] || grep -q 'article_not_found\|未找到该文章' tmp/article.md 2>/dev/null; then
            status=$(curl -L --retry 3 --retry-delay 5 --connect-timeout 20 --max-time 180 \
              -sS -w '%{http_code}' -o tmp/article.md "$FRESH" || true)
          fi

          {
            echo "http_status=$status"
            echo "source_url=$SOURCE"
            echo "bytes=$(wc -c < tmp/article.md | tr -d ' ')"
            echo "fetched_at=$(date -u +%FT%TZ)"
          } > tmp/fetch-status.txt

          test -s tmp/article.md
      - name: Commit temporary result
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/article.md tmp/fetch-status.txt
          git commit -m 'chore: store temporary ReadGZH result' || exit 0
          git push
